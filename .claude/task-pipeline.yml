mode: full
stack:
  language: typescript
  package-manager: pnpm
  test-runner: vitest
  mutation-tool: stryker
  packages:
    backend:
      language: python
      test-runner: pytest
      mutation-tool: mutmut
    # frontend: sin entrada → hereda el `stack:` top-level completo (TS/pnpm/vitest/stryker)
features:
  tdd: true
  closing-documentation:
    tsdoc: true
    technical-docs: true
    context-log: true
  mutation-gate: 80
  caveman: lite
  github-tracking:
   enabled: false
   repo: drossan/syntax
   project: 6
   assignee: "@me"
  sdd: true
  git-automation:
    auto-commit: true
    auto-pr: true
    co-author: false
models:
  design-review: claude-opus-4-8
  scenario-coverage: sonnet
  fact-checker: sonnet
