# cosmic-ray — config de mutation testing del backend.
[cosmic-ray]
module-path = "app/domain/services/auth_service.py"
timeout = 90.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest -x -q tests/test_router_auth.py tests/test_auth_service.py"

[cosmic-ray.distributor]
name = "local"
