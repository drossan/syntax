# cosmic-ray — config de mutation testing del backend.
# Se acota `module-path` al fichero de la tarea en curso (mutar solo lo tocado
# mantiene el gate en segundos). `test-command` corre los tests de ese módulo.
# Sesión (SQLite) generada por `cosmic-ray init` → gitignore.
[cosmic-ray]
module-path = "app/infra/vectorstore/pgvector.py"
timeout = 90.0
excluded-modules = []
test-command = ".venv/bin/python -m pytest -x -q tests/test_pgvector_store_search.py tests/test_pgvector_store_documents.py"

[cosmic-ray.distributor]
name = "local"
